[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
; Indispensable : sans ça php-fpm vide l'environnement et Laravel ne voit pas
; les variables injectées par Coolify (DB, APP_KEY, INFINIREACH_*...).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
